/* =====================================================================
   OOLACILE — The Prison Escape (vertical slice)
   Single-file HTML5 canvas game. All art, text and sound generated in code.
   Sections: CORE · AUDIO · ART · DATA · MAP · ENTITIES · RENDER · COMBAT ·
             AI · UI · STORY · SCENES/MAIN

// =====================================================================
//  CORE — constants, canvas, utilities, timers/tweens, input, pixel font

const W = 384, H = 216, TS = 16;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let SCALE = 1, OFFX = 0, OFFY = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const vw = Math.floor(window.innerWidth * dpr), vh = Math.floor(window.innerHeight * dpr);
  let s = Math.floor(Math.min(vw / W, vh / H));
  if (s < 1) s = Math.min(vw / W, vh / H);
  SCALE = s;
  canvas.width = vw; canvas.height = vh;
  canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
  OFFX = Math.floor((vw - W * s) / 2); OFFY = Math.floor((vh - H * s) / 2);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

function present() {
  ctx.fillStyle = '#030409';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(buf, 0, 0, W, H, OFFX, OFFY, Math.round(W * SCALE), Math.round(H * SCALE));
}

// ---------- utilities ----------

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

const key2 = (x, y) => x + ',' + y;

// ---------- dice ----------
function rollDice(n, s) {

  for (let i = 0; i < n; i++) { const r = ri(1, s); rolls.push(r); t += r; }
  return { t, rolls };

function parseDice(str) { // "2d6+3" -> {n,s,b}

// ---------- timers & tweens (driven by the main loop so pausing is safe) ----------
const Timers = { list: [], time: 0 };

// ---------- input ----------
const mouse = { x: -100, y: -100, down: false, inside: false, cursor: 'arrow' };
const keysDown = {};
const inputQueue = [];
function toLow(e) {

  const p = toLow(e); mouse.x = p.x; mouse.y = p.y;

  '×': '.../.../#.#/.#./#.#', '☾': '.##/#../#../#../.##', '✦': '..#../..#../#####/..#../..#..', '⚔': '#...#/.#.#./..#../.#.#./#...#',

  '·': './././#', '★': '..#../..#../#####/.###./.#.#.', '☆': '..#../.#.#./#...#/.#.#./.#.#.',

const FONT = {};

  FONT[' '] = { w: 2, rows: [] };

const FONT_ATLAS = new Map();
function fontAtlas(color) {

  blue: '#7fb8ff', gold: '#f2c55c', orange: '#ff9a3c', purple: '#c09cff', cyan: '#8fe8ff', ice: '#cfefff', party: '#8fcaff',

// =====================================================================
//  AUDIO — Web Audio synthesis: ambience, music pulses and SFX
// =====================================================================
const AU = {

  wind: null, drone: null, noiseBuf: null, stepAlt: false, vol: 0.8,

  toggle() { this.on = !this.on; if (this.master) this.master.gain.setTargetAtTime(this.on ? this.vol : 0, this.ac.currentTime, 0.05); },

const SPRITE_CACHE = new Map();
function buildSprite(id, weapon, swap) {
  const key = id + '|' + (weapon || '') + '|' + JSON.stringify(swap || {});
  let c = SPRITE_CACHE.get(key);
  if (c) return c;
  const def = SPR[id];
  const w = def.w, h = def.h;
  const grid = [];
  for (let y = 0; y < h; y++) { const row = (def.rows[y] || '').padEnd(w, '.').slice(0, w); grid.push(row.split('')); }
  if (swap) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (swap[grid[y][x]] && y > 7) grid[y][x] = swap[grid[y][x]];
  // weapon in right hand (hand at col w-4, row ~13 for normal sprites)
  if (weapon && WPN_SPR[weapon]) {
    const ws = WPN_SPR[weapon];
    const hx = w === 16 ? 12 : 20, hy = w === 16 ? 13 : 19;
    ws.rows.forEach((row, ry) => {
      for (let rx = 0; rx < row.length; rx++) {
        const ch = row[rx]; if (ch === '.') continue;
        const gx = hx + rx - ws.ax, gy = hy + ry - ws.ay;
        if (gx >= 0 && gx < w && gy >= 0 && gy < h) grid[gy][gx] = ch;
      }
    });
  }
  // auto outline
  const out = grid.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (grid[y][x] !== '.') continue;
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < w && yy < h && grid[yy][xx] !== '.';
    if (n(x - 1, y) || n(x + 1, y) || n(x, y - 1) || n(x, y + 1)) out[y][x] = 'k';
  }
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = out[y][x]; if (ch === '.') continue;
    cx.fillStyle = PAL[ch] || '#f0f'; cx.fillRect(x, y, 1, 1);
  }
  // white silhouette for hit flashes
  const wc = document.createElement('canvas'); wc.width = w; wc.height = h;
  const wx = wc.getContext('2d'); wx.drawImage(c, 0, 0); wx.globalCompositeOperation = 'source-in'; wx.fillStyle = '#ffffff'; wx.fillRect(0, 0, w, h);
  c.white = wc;
  // tinted silhouette (for awakening aura / selection)
  SPRITE_CACHE.set(key, c);
  return c;
}
function tintedSprite(spr, color) {
  spr.tints = spr.tints || {};
  if (spr.tints[color]) return spr.tints[color];
  const c = document.createElement('canvas'); c.width = spr.width; c.height = spr.height;
  const x = c.getContext('2d'); x.drawImage(spr, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  spr.tints[color] = c; return c;
}

const ENV = {
  void: '#04050a', floorA: '#222a3b', floorB: '#262f42', floorC: '#1d2433', joint: '#141a26', speck: '#3a4660', frost: '#8fa6c8', frost2: '#c8daf0',

// ---------------- tile painter ----------------
function paintFloor(c, x, y, tx, ty, variant) {
  const r = (i) => hash2(tx, ty, i);
  c.fillStyle = r(1) < 0.33 ? ENV.floorA : r(1) < 0.66 ? ENV.floorB : ENV.floorC; c.fillRect(x, y, 16, 16);
  // slabs: two per tile, staggered by row
  c.fillStyle = ENV.joint;
  c.fillRect(x, y, 16, 1);
  const off = (ty & 1) ? 8 : 0;
  c.fillRect(x + ((off + 0) & 15), y, 1, 16);
  if (r(2) < 0.5) c.fillRect(x + ((off + 8) & 15), y + 8, 1, 8);
  if (r(3) < 0.4) c.fillRect(x, y + 8, 16, 1);
  // tone variation per slab
  c.fillStyle = 'rgba(255,255,255,0.025)'; if (r(4) < 0.5) c.fillRect(x + 1, y + 1, 7, 7);
  c.fillStyle = 'rgba(0,0,0,0.12)'; if (r(5) < 0.4) c.fillRect(x + 8, y + 9, 8, 7);
  // specks & cracks
  for (let i = 0; i < 6; i++) { c.fillStyle = r(10 + i) < 0.5 ? ENV.speck : ENV.joint; c.fillRect(x + Math.floor(r(20 + i) * 16), y + Math.floor(r(30 + i) * 16), 1, 1); }
  if (r(6) < 0.18) { c.fillStyle = ENV.joint; let cx0 = x + 3 + Math.floor(r(7) * 9), cy0 = y + 3 + Math.floor(r(8) * 8); for (let i = 0; i < 5; i++) { c.fillRect(cx0, cy0, 1, 1); cx0 += r(40 + i) < 0.5 ? 1 : 0; cy0 += 1; } }
  if (variant === 'frost' || r(9) < 0.08) {
    for (let i = 0; i < 10; i++) { c.fillStyle = r(50 + i) < 0.6 ? ENV.frost : ENV.frost2; c.fillRect(x + Math.floor(r(60 + i) * 16), y + Math.floor(r(70 + i) * 16), 1, 1); }
  }
  if (variant === 'blood') {
    c.fillStyle = '#4a1018'; c.fillRect(x + 4, y + 6, 7, 4); c.fillRect(x + 6, y + 5, 4, 7); c.fillStyle = '#5e1420'; c.fillRect(x + 6, y + 7, 3, 2); c.fillRect(x + 12, y + 11, 2, 1);
  }
}
function paintWallFace(c, x, y, tx, ty, thinTop) {

  c.fillStyle = '#0e1612'; c.fillRect(x + 3, y + 3, 10, 10); c.fillRect(x + 2, y + 5, 12, 6); c.fillRect(x + 5, y + 2, 6, 12);

  c.fillStyle = '#6ab04e'; c.fillRect(x + 7, y + 7, 2, 1);

function paintCarpet(c, x, y, tx, ty, edges) {
  c.fillStyle = '#4a1620'; c.fillRect(x, y, 16, 16);
  c.fillStyle = '#5a1c28'; for (let i = 0; i < 16; i += 4) c.fillRect(x + ((i + ty * 2) % 16), y + i, 2, 2);
  c.fillStyle = '#a8803a';
  if (edges.n) c.fillRect(x, y + 1, 16, 1); if (edges.s) c.fillRect(x, y + 14, 16, 1);
  if (edges.w) c.fillRect(x + 1, y, 1, 16); if (edges.e) c.fillRect(x + 14, y, 1, 16);
}
function paintRubble(c, x, y, tx, ty) {
  for (let i = 0; i < 6; i++) {
    const rx = x + 1 + Math.floor(hash2(tx, ty, i) * 12), ry = y + 2 + Math.floor(hash2(tx, ty, i + 7) * 11), s = 2 + Math.floor(hash2(tx, ty, i + 3) * 3);
    c.fillStyle = '#0c0f16'; c.fillRect(rx, ry + 1, s, s - 1);
    c.fillStyle = '#4a5163'; c.fillRect(rx, ry, s, s - 1);

}

  c.fillStyle = '#b8c8dc'; c.fillRect(x, y, 16, 16);

// ---------------- UI frames ----------------
function panel(x, y, w, h, opt = {}) {
  const bg = opt.bg || 'rgba(10,12,20,0.94)';
  g.fillStyle = '#04050a'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = bg; g.fillRect(x, y, w, h);
  g.fillStyle = opt.border || '#3b4460'; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1); g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
  g.fillStyle = opt.inner || '#1c2130'; g.fillRect(x + 1, y + 1, w - 2, 1); g.fillRect(x + 1, y + 1, 1, h - 2);
  if (!opt.plain) {
    // gothic corner ornaments
    const oc = opt.orn || '#8a7a52';
    const corner = (cx, cy, fx, fy) => { g.fillStyle = oc; g.fillRect(cx, cy, 3, 1); g.fillRect(cx + (fx < 0 ? 2 : 0), cy, 1, 3); g.fillStyle = '#c8b47a'; g.fillRect(cx + (fx < 0 ? 2 : 0), cy, 1, 1); };
    corner(x - 1, y - 1, 1, 1); corner(x + w - 2, y - 1, -1, 1);
    g.fillStyle = oc; g.fillRect(x - 1, y + h - 1, 3, 1); g.fillRect(x - 1, y + h - 3, 1, 3); g.fillRect(x + w - 2, y + h - 1, 3, 1); g.fillRect(x + w, y + h - 3, 1, 3);
    if (opt.title) {
      const tw = textWidth(opt.title) + 10;
      const tx = x + Math.floor((w - tw) / 2);
      g.fillStyle = '#04050a'; g.fillRect(tx - 1, y - 5, tw + 2, 11);
      g.fillStyle = '#1a1f2e'; g.fillRect(tx, y - 4, tw, 9);
      g.fillStyle = oc; g.fillRect(tx, y - 4, tw, 1); g.fillRect(tx, y + 4, tw, 1);
      drawText(opt.title, tx + 5, y - 3, opt.titleCol || COL.gold);
    }
  }
}
function bar(x, y, w, h, frac, col, back = '#1a0c10', opt = {}) {
  g.fillStyle = '#04050a'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = back; g.fillRect(x, y, w, h);
  const fw = Math.round(w * clamp(frac, 0, 1));
  if (fw > 0) {
    g.fillStyle = col; g.fillRect(x, y, fw, h);
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x, y, fw, 1);
    g.fillStyle = 'rgba(0,0,0,0.25)'; if (h > 2) g.fillRect(x, y + h - 1, fw, 1);
  }
  if (opt.ghost != null && opt.ghost > frac) { g.fillStyle = 'rgba(255,230,200,0.5)'; g.fillRect(x + fw, y, Math.round(w * (opt.ghost - frac)), h); }
  if (opt.extra) { g.fillStyle = opt.extraCol || '#cfe8ff'; g.fillRect(x, y, Math.round(w * clamp(opt.extra, 0, 1)), 1); }
}
function button(x, y, w, h, label, hot, disabled, col) {
  g.fillStyle = '#04050a'; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = disabled ? '#141722' : hot ? '#2e3650' : '#1b2031'; g.fillRect(x, y, w, h);
  g.fillStyle = disabled ? '#232838' : hot ? '#8a7a52' : '#3b4460'; g.fillRect(x, y, w, 1); g.fillRect(x, y + h - 1, w, 1); g.fillRect(x, y, 1, h); g.fillRect(x + w - 1, y, 1, h);
  drawText(label, x + Math.floor(w / 2), y + Math.floor((h - 7) / 2), disabled ? COL.dim : hot ? COL.gold : (col || COL.text), { align: 'center' });
}
function inRect(px, py, x, y, w, h) { return px >= x && py >= y && px < x + w && py < y + h; }

const CURSORS = {
  arrow: ['k.......', 'kwk.....', 'kwwk....', 'kwwwk...', 'kwwwwk..', 'kwwwwwk.', 'kwwkkkk.', 'kwk.....', 'kk......'],
  attack: ['kk......', 'kwk.....', '.kwk....', '..kwk...', '...kwk.k', '....kwkk', '.....kk.', '....kkyk', '.......k'],
  interact: ['..kk....', '.kyyk...', '.kyyk...', '.kyykkk.', 'kkyyyyyk', 'kyyyyyyk', 'kyyyyyyk', '.kyyyyk.', '..kkkk..'],
  move: ['...k....', '..kwk...', '.kwwwk..', 'kkkwkkk.', '..kwk...', '..kwk...', '..kkk...'],
  no: ['.kkkkk..', 'kjjjjjk.', 'kjk.kjjk', 'kj.kkjjk', 'kjkkjkjk', 'kjjk.kjk', '.kjjjjk.', '..kkkk..'],
  cast: ['...k....', '..kck...', '.kcCck..', 'kcCwCck.', '.kcCck..', '..kck...', '...k....'],
};
function drawCursor() {
  if (!mouse.inside) return;
  const rows = CURSORS[mouse.cursor] || CURSORS.arrow;
  const off = (mouse.cursor === 'move' || mouse.cursor === 'cast' || mouse.cursor === 'no') ? -3 : 0;
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.') continue;
    g.fillStyle = PAL[ch] || '#fff'; g.fillRect(mouse.x + x + off, mouse.y + y + off, 1, 1);
  }
}

// ---------------- stylised OOLACILE logo ----------------
const LOGO_GLYPHS = {
  O: ['..#####..', '.##...##.', '##.....##', '##.....##', '##.....##', '##.....##', '##.....##', '##.....##', '.##...##.', '..#####..'],
  L: ['###......', '.##......', '.##......', '.##......', '.##......', '.##......', '.##......', '.##....#.', '.##...##.', '#########'],
  A: ['...###...', '..##.##..', '.##...##.', '.##...##.', '##.....##', '#########', '##.....##', '##.....##', '##.....##', '###...###'],
  C: ['..######.', '.##....##', '##......#', '##.......', '##.......', '##.......', '##.......', '##......#', '.##....##', '..######.'],
  I: ['#######', '..###..', '..###..', '..###..', '..###..', '..###..', '..###..', '..###..', '..###..', '#######'],
  E: ['#########', '.##....##', '.##......', '.##...#..', '.######..', '.##...#..', '.##......', '.##......', '.##....##', '#########'],
};
function drawLogo(cx, y, scale, t) {
  const word = 'OOLACILE';
  let total = 0; for (const ch of word) total += (LOGO_GLYPHS[ch][0].length + 2) * scale;
  let x = Math.floor(cx - total / 2);
  for (let li = 0; li < word.length; li++) {
    const rows = LOGO_GLYPHS[word[li]], gw = rows[0].length;
    for (let pass = 0; pass < 2; pass++) {
      for (let ry = 0; ry < rows.length; ry++) for (let rx = 0; rx < gw; rx++) {
        if (rows[ry][rx] !== '#') continue;
        const px = x + rx * scale, py = y + ry * scale;
        if (pass === 0) { g.fillStyle = '#04050a'; g.fillRect(px - 1, py - 1, scale + 2, scale + 3); }
        else {
          const f = ry / rows.length;
          g.fillStyle = f < 0.2 ? '#f4fbff' : f < 0.45 ? '#cfe6ff' : f < 0.7 ? '#8fb4e0' : '#5a78a8';
          const gl = (px - py * 0.7) - (((t * 70) % (total + 260)) - 130 + cx - total / 2);
          if (gl > 0 && gl < 5 * scale) g.fillStyle = '#ffffff';
          g.fillRect(px, py, scale, scale);
          if (ry === 0 || rows[ry - 1][rx] !== '#') { g.fillStyle = '#ffffff'; g.fillRect(px, py, scale, 1); }
        }
      }
    }
    // icicles hanging from the bottom of each letter
    for (let rx = 0; rx < gw; rx++) {
      if (rows[rows.length - 1][rx] !== '#') continue;
      const len = Math.floor(hash2(li, rx, 5) * 4) * (hash2(li, rx, 6) < 0.45 ? 1 : 0);
      for (let k = 0; k < len * scale; k++) { g.fillStyle = k < 2 ? '#8fb4e0' : '#cfe6ff'; g.fillRect(x + rx * scale + Math.floor(scale / 2), y + rows.length * scale + k, 1, 1); }
    }
    x += (gw + 2) * scale;
  }
}

  note_scratch: 'Gouged into the frost-slick stone, over and over, until the letters became grooves:\n\n{ice}I FORGET MY NAME. I FORGET MY NAME. I FORG{/}\n\nBelow it, in a different, steadier hand:\n{lore}"Then let it go. They cannot take what you no longer carry. The Undead lose it first."{/}',
  note_hollow: 'Day ?? - They wheel us east when the blue goes out of our eyes. The big machine hums all night and the walls are warm near it, the only warm place in Oolacile.\n\nThe guards call the jars "capsules". The Warden weighs them like gold.\n\nIf you are reading this you woke up. {red}Do not let them see you are awake.{/}\n\nP.S. The red draughts the guards carry will burn you. The green swamp-water will not. I do not know why. We are backwards now.',

  guard_journal: 'Day 212. Another batch of hollows woke up. Warden says it don\'t matter - empty vessels still hold heat.\n\nDay 219. G2 got loose again. Took three of us to chain the brute back in the pit room. {red}He likes throwing us at the spikes.{/}\n\nDay 223. The Receptionist is skimming the silver again. Nobody says anything. She has a way of standing behind you.\n\nDay 230. I\'ve stopped sleeping. The machine sings in the walls.',

// ---------------- core attack ----------------

  if (sk && sk.desperate && hpFrac(att) < 0.5) { const b = rollDmg('1d10', roll.crit); total += b.t; parts.push('desperate ' + b.txt); }
  const tr = trinket(att); if (tr && tr.meleeDmg) { total += tr.meleeDmg; parts.push('+' + tr.meleeDmg); }

    if (g6 === 1) { total = Math.floor(total / 2); parts.push('{red}gamble 1: halved{/}'); }
    else if (g6 === 6) { total *= 3; parts.push('{gold}gamble 6: TRIPLE!{/}'); }
    else { const b = rollDmg('1d6', false); total += b.t; parts.push(`gamble ${g6}: ${b.txt}`); }
    floatText(att, `d6: ${g6}`, COL.gold);
  }
  total = Math.max(1, total);
  clog(`${nm(att)} ${label}→ ${nm(tgt)}: ${roll.txt} ${roll.crit ? '{gold}CRIT!{/}' : '{green}HIT{/}'} ${parts.join(' ')} = {red}${total + fireExtra}{/}`);
  if (roll.crit) { floatText(tgt, 'CRITICAL', COL.gold); screenFlash('#ffffff', 0.12, 0.25); }
  dealDamage(tgt, total, 'slash', att, { crit: roll.crit });
  if (fireExtra) dealDamage(tgt, fireExtra, 'fire', att, { silent: true });
  if (tgt.dead || tgt.downed) return true;
  // on-hit riders
  if (hasStatus(tgt, 'cinder') && cheb(att.x, att.y, tgt.x, tgt.y) <= 1) { const c = rollDmg('1d4', false); clog(`${nm(att)} is scorched by cinders: {orange}${c.t}{/}`); dealDamage(att, c.t, 'fire', tgt, { silent: true }); }
  if (sk && sk.onHit) addStatus(tgt, sk.onHit, sk.turns || 2);
  if (sk && sk.stunSave) { const s = saveRoll(tgt, 'vig', saveDC(att, 'str')); clog(`${nm(tgt)} ${s.txt} ${s.ok ? '{green}resists{/}' : '{yellow}STUNNED{/}'}`); if (!s.ok) addStatus(tgt, 'stunned', 1); }

// ---------------- skill executor ----------------
function spendFor(u, sk) {

}

}

    case 'weapon': {

        await weaponAttack(u, target, sk);
        let t2 = target.dead || target.downed ? G.units.find(e => hostile(u, e) && !e.dead && !e.downed && cheb(e.x, e.y, u.x, u.y) === 1) : target;
        if (t2 && !u.dead) { await wait(200); await weaponAttack(u, t2, sk); }
      } else await weaponAttack(u, target, sk);
      break;
    }
    case 'spell': await spellAttack(u, target, sk); break;
    case 'saveAoe': {
      const c = sk.target === 'self' ? { x: u.x, y: u.y } : sk.target === 'enemy' ? { x: target.x, y: target.y } : tile;
      castFX(u, sk.fx); faceTo(u, c.x);
      await wait(200);
      if (sk.target !== 'self' && (c.x !== u.x || c.y !== u.y)) await projectile(u, { px: c.x * TS, py: c.y * TS }, sk.fx || 'arcane');
      if (skId === 'beast_roar' || skId === 'taunt') { sfx('roar'); shake(4); }
      aoeFX(c.x * TS + 8, c.y * TS + 8, sk.aoe || 0, sk.fx || (skId === 'ash_cloud' ? 'ash' : 'arcane'));
      if (skId === 'frost_stomp') for (const t of aoeTiles(c.x, c.y, 1)) burst(t.x * TS + 8, t.y * TS + 10, 4, { col: ['#bfeaff', '#ffffff'], speed: 30, up: 30, life: 0.6, glow: true });
      let victims = sk.aoe === 0 ? [target] : unitsInAoe(c.x, c.y, sk.aoe);
      if (sk.enemiesOnly) victims = victims.filter(v => hostile(u, v));
      if (sk.target === 'self') victims = victims.filter(v => v !== u);
      const dc = saveDC(u, sk.stat);
      clog(`${nm(u)} uses {gold}${sk.name}{/} (DC ${dc})`);
      for (const v of victims) {
        const s = saveRoll(v, sk.save, dc);
        let line = `  ${nm(v)} ${s.txt} ${s.ok ? '{green}save{/}' : '{red}fail{/}'}`;
        if (sk.dmg) {
          const d = rollDmg(sk.dmg, false); let dmg = d.t + modOf(u, sk.stat);
          const w = weaponOf(u); if (w.catalyst && w.spellDmg && sk.stat !== 'str') dmg += w.spellDmg;
          if (s.ok) dmg = Math.floor(dmg / 2);
          dmg = Math.max(1, dmg);
          line += ` ${d.txt} → {red}${dmg}{/}`;
          dealDamage(v, dmg, sk.fx === 'fire' ? 'fire' : sk.fx === 'frost' ? 'cold' : sk.fx === 'poison' ? 'poison' : 'magic', u);
        }
        if (!s.ok && sk.status && !v.dead && !v.downed) { addStatus(v, sk.status, sk.turns || 1, sk.status === 'taunted' ? { by: u.id } : {}); }
        else if (s.ok && sk.elseStatus && !v.dead) addStatus(v, sk.elseStatus, 1);
        clog(line);
      }
      if (!victims.length) clog('  {gray}...but it touches no one.{/}');
      if (sk.selfDmg) { const d = rollDmg(sk.selfDmg, false); clog(`  The light burns ${nm(u)}: {red}${d.t}{/}`); dealDamage(u, d.t, 'magic', u); }
      break;
    }
    case 'healAoe': {
      castFX(u, 'holy'); await wait(200);
      aoeFX(tile.x * TS + 8, tile.y * TS + 8, sk.aoe, 'holy');
      const vs = unitsInAoe(tile.x, tile.y, sk.aoe).filter(v => v.team === u.team);
      clog(`${nm(u)} invokes {gold}${sk.name}{/}.`);
      for (const v of vs) {
        const d = rollDmg(sk.dmg, false), amt = d.t + modOf(u, sk.stat) + (weaponOf(u).catalyst === 'fai' ? weaponOf(u).spellDmg || 0 : 0);
        if (v.undead) clog(`  ${nm(v)} {red}burns{/} under the blessing: ${d.txt} = {red}${amt}{/}`);
        else clog(`  ${nm(v)} heals ${d.txt} = {green}${amt}{/}`);
        healUnit(v, amt, u, 'heal');
      }
      break;
    }
    case 'buff': {
      if (target.elf && !u.elf && target !== u) { bark(target, 'refuse'); clog(`${nm(target)} {purple}refuses{/} the blessing. Elven Disdain.`); break; }
      castFX(u, 'arcane'); sfx('spell', { k: 'holy' });
      if (sk.status === 'ward') { addStatus(target, 'ward', sk.turns, { v: sk.amount }); floatText(target, `Ward ${sk.amount}`, '#8fcaff'); }
      else { addStatus(target, sk.status, sk.turns); if (sk.amount) { addStatus(target, 'ward', sk.turns, { v: sk.amount }); } }
      clog(`${nm(u)} → ${nm(target)}: {gold}${sk.name}{/}.`);
      burst(target.px + 8, target.py + 6, 10, { col: ['#8fcaff', '#ffffff'], speed: 20, up: 20, glow: true, life: 0.8 });
      break;
    }
    case 'selfStatus': {
      castFX(u, skId === 'cinder_skin' || skId === 'immolate' || skId === 'smoldering_blade' ? 'fire' : skId === 'frost_armor' ? 'frost' : 'arcane');
      sfx('spell', { k: skId === 'counter' ? 'dark' : 'holy' });
      addStatus(u, sk.status, sk.turns, sk.charges ? { charges: sk.charges } : {});
      clog(`${nm(u)} uses {gold}${sk.name}{/}.`);

function itemIcon(id) {

function itemTipLines(id) {

// ---------------- dialogue ----------------
function makeDialogueModal(treeKey, nodeKey = 'start', onEnd) {
  const tree = DIALOGUE[treeKey];
  const m = {
    type: 'dialogue', tree, nodeKey, node: null, shown: 0, onEnd,
    setNode(k) {
      if (k === 'end' || !k) { UI.close(); if (this.onEnd) this.onEnd(); return; }
      let n = tree[k];
      if (n.dyn) n = STORY.dynNode(n.dyn);
      this.node = n; this.shown = 0;
      if (n.fx && !n.choices && n.next) STORY.fx(n.fx);
      else if (n.fx && n.choices) STORY.fx(n.fx);
      else if (n.fx && n.go === 'end') { }
    },
    advance(choice) {
      const n = this.node;
      if (this.shown < stripMarkup(n.text).length) { this.shown = 9999; return; }
      if (n.choices) {
        if (choice == null) return;
        const c = n.choices[choice]; if (!c) return;
        sfx('confirm');
        this.setNode(c.go);
        if (c.fx) STORY.fx(c.fx);
        return;
      }
      sfx('ui');
      if (n.go === 'end' && n.fx) { UI.close(); if (this.onEnd) this.onEnd(); STORY.fx(n.fx); return; }
      this.setNode(n.next || n.go || 'end');
    },
    update(dt) { const len = stripMarkup(this.node.text).length; if (this.shown < len) { const before = Math.floor(this.shown); this.shown += dt * 55; if (Math.floor(this.shown) !== before && Math.floor(this.shown) % 3 === 0) sfx('type'); } },
    draw() {
      const n = this.node; if (!n) return;
      g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, W, H);
      const x = 6, y = 118, w = 372, h = 94;
      panel(x, y, w, h, { bg: 'rgba(8,10,18,0.97)' });
      const su = speakerUnit(n.who);
      g.fillStyle = '#04050a'; g.fillRect(x + 6, y + 8, 52, 52);
      g.fillStyle = '#8a7a52'; g.fillRect(x + 7, y + 9, 50, 50);
      if (su) drawPortrait(su, x + 8, y + 10, 48, 48, { bg: '#0e121c' });
      const name = su ? (su.ckey ? COMPANIONS[su.ckey].full : su.name) : n.who;
      drawText(name, x + 64, y + 6, COL.gold);
      const full = n.text; const plainLen = stripMarkup(full).length;
      const shownTxt = this.shown >= plainLen ? full : cutMarkup(full, Math.floor(this.shown));
      const lines = wrapText(shownTxt, w - 72);
      lines.forEach((l, i) => drawText(l, x + 64, y + 17 + i * 9, COL.text));
      if (n.choices && this.shown >= plainLen) {
        const cy = y + 17 + Math.max(lines.length, 2) * 9 + 3;
        n.choices.forEach((c, i) => {
          const yy = cy + i * 10, hot = inRect(mouse.x, mouse.y, x + 62, yy - 1, w - 70, 10);
          if (hot) { g.fillStyle = 'rgba(242,197,92,0.12)'; g.fillRect(x + 62, yy - 1, w - 70, 10); }
          drawText(`${i + 1}. ${c.t}`, x + 66, yy, hot ? COL.gold : COL.cyan);
        });
      } else if (this.shown >= plainLen && Math.floor(TIME * 2) % 2) drawText('▼', x + w - 12, y + h - 11, COL.gold);
    },
    choiceAt(mx, my) {
      const n = this.node; if (!n.choices) return null;
      const lines = wrapText(n.text, 372 - 72); const cy = 118 + 17 + Math.max(lines.length, 2) * 9 + 3;
      for (let i = 0; i < n.choices.length; i++) if (inRect(mx, my, 68, cy + i * 10 - 1, 302, 10)) return i;
      return null;
    },
    click(mx, my) { this.advance(this.choiceAt(mx, my)); },
    key(k) {
      if (k >= '1' && k <= '9') this.advance(+k - 1);
      else if (k === 'Enter' || k === ' ' || k === 'f' || k === 'F') this.advance(null);
    },
  };
  m.setNode(nodeKey);
  return m;
}
function cutMarkup(str, n) {
  let out = '', count = 0, i = 0;
  while (i < str.length && count < n) {
    if (str[i] === '{') { const j = str.indexOf('}', i); if (j > i) { out += str.slice(i, j + 1); i = j + 1; continue; } }
    out += str[i]; count++; i++;
  }
  return out;
}

function makeLootModal(title, loot, onDone) {
  return {

    take(i) {

      addItem(r[0], n);

      sfx(r[0] === 'silver' ? 'coin' : 'loot');
      r[1] = 0;
      STORY.onLoot(r[0]);
      if (!this.rows().length) { UI.close(); if (this.onDone) this.onDone(); }
    },
    geom() { const n = Math.max(1, this.rows().length), h = 34 + n * 16; return { x: 102, y: Math.floor(96 - h / 2), w: 180, h }; },

      for (let i = 0; i < rows.length; i++) if (inRect(mx, my, x + 4, y + 9 + i * 16, w - 8, 15)) { this.take(i); return; }

    drawWorld(cam);

    drawLightShafts(cam);
    drawOverlays(cam);
    drawGlowAndText(cam);
    if (UI.fade > 0) { g.globalAlpha = UI.fade; g.fillStyle = '#000'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
    if (UI.letterbox > 0) { const h = Math.round(22 * UI.letterbox); g.fillStyle = '#000'; g.fillRect(0, 0, W, h); g.fillRect(0, H - h, W, h); }
    if (UI.intro && UI.intro.i >= 0) {
      g.globalAlpha = UI.intro.a;
      const last = UI.intro.i === 2;
      if (last) { drawLogo(W / 2, 80, 2, TIME); drawText('The Frozen North', W / 2, 110, COL.lore, { align: 'center' }); }
      else drawText(UI.intro.lines[UI.intro.i], W / 2, 100, '#cfd8e6', { align: 'center', scale: 1 });
      g.globalAlpha = 1;
    }
    if (UI.namecard) {
      const t = UI.namecard.t, a = Math.min(1, t * 2) * Math.min(1, (2.4 - t) * 3);
      g.globalAlpha = clamp(a, 0, 1);
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 70, W, 50);
      g.fillStyle = '#8a1a24'; g.fillRect(0, 70, W, 1); g.fillRect(0, 119, W, 1);
      const off = Math.round((1 - Math.min(1, t * 1.5)) * 40);
      drawText(UI.namecard.title, W / 2 - off, 78, '#e04050', { align: 'center', scale: 3, shadow: '#2a0408' });
      drawText(UI.namecard.sub, W / 2 + off, 106, COL.bone, { align: 'center' });
      g.globalAlpha = 1;
    }
    if (G.mode !== 'cutscene' || UI.modal) { if (UI.fade < 0.5) drawHUD(); }
    if (UI.modal) { UI.tip = null; UI.modal.draw(); }
    drawTooltip();
  },
  onKey(k, e) {
    if (!G) return;
    if (UI.modal) { if (UI.modal.key) UI.modal.key(k, e); return; }
    if (G.mode === 'cutscene' || G.mode === 'dead') return;
    if (UI.hints.length && (k === 'Enter')) { UI.hints.shift(); return; }
    if (inCombat() && combatKey(k)) return;
    switch (k) {
      case 'Escape': UI.open(makePauseModal()); return;
      case 'i': case 'I': UI.open(makeInventoryModal()); return;
      case 'c': case 'C': UI.open(makeCharModal()); return;
      case 'm': case 'M': UI.open(makeMapModal()); return;
      case 'l': case 'L': UI.logBig = !UI.logBig; sfx('ui'); return;
      case 'Tab': if (!inCombat() && G.party.length > 1 && !EXP.moving) { setLeader(G.party[(G.leader + 1) % G.party.length]); sfx('ui'); UI.toast(`Leading: {gold}${leader().name}{/}`, 1.2); } return;
      case 'q': case 'Q': case 'e': case 'E': {
        const list = inCombat() ? combatants() : partyUnits();
        if (!list.length) return;
        const cur = CAM.focus != null ? list.findIndex(u => u.id === CAM.focus) : list.indexOf(leader());
        const ni = (cur + (k.toLowerCase() === 'e' ? 1 : -1) + list.length) % list.length;
        CAM.focus = list[ni].id; CAM.free = false; sfx('hover');
        return;
      }
      case 'f': case 'F': {
        if (inCombat()) return;
        const t = nearInteractable(leader());
        if (t) doInteract(t); else sfx('error');
        return;
      }
    }
  },
  onClick(x, y, btn) {
    if (!G) return;
    if (UI.modal) { if (UI.modal.click) UI.modal.click(x, y, btn); return; }
    if (G.mode === 'cutscene' || G.mode === 'dead') return;
    if (UI.hints.length) { const h = UI.hints[0]; const lines = wrapText(h.text, 196), hh = lines.length * 9 + 8; if (inRect(x, y, 4, H - 38 - hh, 210, hh)) { UI.hints.shift(); return; } }
    if (partyFrameClick(x, y)) return;
    if (bottomBarClick(x, y)) return;
    if (inCombat()) { combatClick(x, y, btn); return; }
    if (btn !== 0) return;
    const cam = camOrigin0();
    const tx = Math.floor((x + cam.x) / TS), ty = Math.floor((y + cam.y) / TS);
    CAM.focus = null;
    if (EXP.moving) { EXP.path = []; }
    const foe = G.units.find(u => u.team === 'enemy' && !u.dead && u.x === tx && u.y === ty && tileVisible(tx, ty));
    if (foe) { EXP.path = []; EXP.then = null; clog(`${nm(leader())} strikes first!`); startCombat([foe.group]); return; }
    if (tryInteractAt(tx, ty)) return;
    if (inMap(tx, ty) && G.seen[idx(tx, ty)] && walkableTile(tx, ty)) exploreWalkTo(tx, ty);
  },
  onWheel(d) { if (UI.modal && UI.modal.wheel) UI.modal.wheel(d); },
};

// ---------------- ending ----------------
SCENES.ending = {
  enter() {
    snowInit(220); AU.setMode('ending'); this.t = 0; this.line = -1; this.typed = 0; this.card = false; this.done = false;
    const comp = partyUnits().filter(u => u.ckey);
    this.party = partyUnits();
    this.lines = [
      'The gate groans shut behind you. Ahead, the Frozen Tundra runs white to the edge of the world.',
      comp.length ? `${comp.map(c => c.name).join(', ')} walk${comp.length === 1 ? 's' : ''} at your back. No one looks back.` : 'You walk alone. There is no one left to lose.',
      'Somewhere past the Pale Ridge, the Forbidden Crown keeps its seven Eyes open.',
      hasItem('ruined_map') ? 'The ruined map is heavy in your hand. The X is a promise.' : 'Whatever drank the warmth of Oolacile is waiting there, still thirsty.',
      'And one of the Eyes has already turned toward you.',
    ];
    this.run();
  },
  async run() {
    await wait(1800);
    for (let i = 0; i < this.lines.length; i++) {
      this.line = i; this.typed = 0;
      await wait(this.lines[i].length * 40 + 1900);
    }
    await wait(600);
    this.card = true; sfx('victory');
    G.flags.completed = true; saveGame();
  },
  update(dt) {
    this.t += dt; snowUpdate(dt, 22);
    if (this.line >= 0) { const b = Math.floor(this.typed); this.typed += dt * 26; if (Math.floor(this.typed) !== b && Math.floor(this.typed) % 3 === 0 && this.typed < this.lines[this.line].length) sfx('type'); }
    updateTimers(0);
    updateUI(dt);
  },
  draw() {
    const bg = cachedLayer('tundra', () => {
      ditherGradient(0, 110, '#070b18', '#3a4c70'); ditherGradient(110, 150, '#3a4c70', '#6a7c9c');
      for (let i = 0; i < 120; i++) { g.fillStyle = hash2(i, 5, 1) < 0.85 ? '#8898b8' : '#e8f0ff'; g.fillRect(Math.floor(hash2(i, 6, 1) * W), Math.floor(hash2(i, 7, 1) * 90), 1, 1); }
      moon(64, 34, 11);
      mountains(128, 34, '#5a6a8c', 21, 0.9);
      mountains(140, 20, '#43506e', 5, 1.3);
      ditherGradient(150, H, '#b8c8dc', '#8a9cb8');
    });
    g.drawImage(bg, 0, 0);
    // aurora
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let x = 0; x < W; x += 2) {
      const y = 30 + Math.sin(x * 0.02 + TIME * 0.4) * 10 + Math.sin(x * 0.05 + TIME * 0.7) * 5;
      for (let k = 0; k < 22; k++) { g.fillStyle = `rgba(${60 + k * 2},${200 - k * 3},${170},${0.035 * (1 - k / 22)})`; g.fillRect(x, y + k, 2, 1); }
    }
    g.restore();
    // a single red glint on the far ridge: the Eye
    const blink = Math.sin(TIME * 1.5) > 0.2 ? 1 : 0.3;
    g.globalAlpha = blink; g.fillStyle = '#ff4050'; g.fillRect(262, 101, 2, 1); g.fillStyle = 'rgba(255,64,80,0.35)'; g.fillRect(260, 100, 6, 3); g.globalAlpha = 1;
    // footprints and party walking into the distance
    const walk = Math.min(1, this.t / 14);
    this.party.forEach((u, i) => {
      const spr = unitSprite(u), s = 1;
      const x = Math.round(lerp(60, 200, walk) - i * 20), y = 168 + (i % 2) * 4 - Math.round(walk * 12) + (Math.floor(TIME * 4 + i) % 2);
      for (let k = 0; k < 8; k++) { g.fillStyle = '#7a8cac'; g.fillRect(x + 6 - k * 6 - 8, y + 20 + (k % 2), 2, 1); }
      g.fillStyle = 'rgba(40,50,70,0.4)'; g.fillRect(x + 3, y + spr.height - 1, 10, 2);
      g.drawImage(spr, x, y);
    });
    snowDraw();
    if (this.line >= 0 && !this.card) {
      const txt = this.lines[this.line].slice(0, Math.floor(this.typed));
      const lines = wrapText(txt, 300);
      g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, 186, W, 26);
      lines.forEach((l, i) => drawText(l, W / 2, 190 + i * 9, '#e8eef7', { align: 'center', shadow: true }));
    }
    if (this.card) this.drawCard();
    drawTooltip(); UI.tip = null;
  },
  drawCard() {
    g.fillStyle = 'rgba(2,3,8,0.78)'; g.fillRect(0, 0, W, H);
    drawText('TO BE CONTINUED', W / 2, 12, '#cfe6ff', { align: 'center', scale: 2, shadow: true });
    drawText('Chapter I - The Prison Escape - complete', W / 2, 32, COL.lore, { align: 'center' });
    const x = 60, y = 44, w = 264, h = 140;
    panel(x, y, w, h, { title: 'THE UNDEAD’S RECORD' });
    const comp = partyUnits().filter(u => u.ckey);
    const p = player();
    const seals = ['p_stones', 'p_riddle', 'p_chess'].filter(f => G.flags[f]).length;
    const rows = [
      ['Turns taken', String(G.stats.turns)],
      ['Companions recruited', comp.length ? `${comp.length}/4 - ${comp.map(c => c.name).join(', ')}` : '0/4 - none'],
      ['Warden defeated?', G.flags.wardenDead ? '{green}Yes{/}' : '{red}No{/}'],
      ['Final level', `${p.lvl} (${CLASSES[p.cls].name}, ${AWAKENINGS[p.awk].name})`],
      ['Enemies slain', String(G.stats.kills)],
      ['Silver found', fmtMoney(G.stats.silverFound)],
      ['Treasury seals broken', `${seals}/3`],
      ['Machine silenced?', G.flags.machineOff ? '{green}Yes{/}' : 'No'],
      ['Time in the cold', fmtTime(G.stats.time)],
    ];
    rows.forEach((r, i) => { drawText(r[0], x + 10, y + 10 + i * 10, COL.gray); drawText(r[1], x + 116, y + 10 + i * 10, COL.text); });
    const ach = G.ach || {};
    drawText('Achievements', x + 10, y + 104, COL.gold);
    Object.entries(ACHIEVEMENTS).forEach(([k, a], i) => {
      const ax = x + 10 + (i % 2) * 126, ay = y + 113 + Math.floor(i / 2) * 9;
      drawText(`${ach[k] ? '★' : '☆'} ${a.name}`, ax, ay - 0, ach[k] ? COL.gold : COL.dim);
      if (inRect(mouse.x, mouse.y, ax, ay - 1, 120, 9)) UI.tip = { lines: [a.desc], x: mouse.x + 8, y: mouse.y - 14 };
    });
    button(W / 2 - 60, 190, 120, 13, 'Return to Title', inRect(mouse.x, mouse.y, W / 2 - 60, 190, 120, 13));
    drawText('Next: the Frozen Tundra', W / 2, 206, COL.dim, { align: 'center' });
  },
  onClick(x, y) {
    if (this.card && inRect(x, y, W / 2 - 60, 190, 120, 13)) { sfx('confirm'); SCENE.go('title'); return; }
    if (!this.card && this.line >= 0) this.typed = 999;
  },
  onKey(k) { if (this.card && (k === 'Enter' || k === 'Escape')) SCENE.go('title'); else if (!this.card) this.typed = 999; },
};

// ---------------- main loop ----------------
let lastT = performance.now();
function processInput() {
  while (inputQueue.length) {
    const ev = inputQueue.shift();
    const sc = SCENE.cur; if (!sc) continue;
    try {
      if (ev.type === 'key' && sc.onKey) sc.onKey(ev.key, ev);
      else if (ev.type === 'click' && sc.onClick) sc.onClick(ev.x, ev.y, ev.button);
      else if (ev.type === 'wheel' && sc.onWheel) sc.onWheel(ev.dy);
    } catch (e) { console.error(e); }
  }
}
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  TIME += dt;
  try {
    processInput();
    const frozen = SCENE.name === 'game' && UI.modal && ['pause', 'controls', 'inversion'].includes(UI.modal.type);
    if (!frozen) updateTimers(dt);
    if (SCENE.name !== 'game') mouse.cursor = 'arrow';
    SCENE.cur.update(dt);
    AU.update();
    SCENE.cur.draw();
    drawCursor();
    present();
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
window.__oolacile = { get G() { return G; }, SCENE, UI, CB, EXP, startCombat, player, leader, unitById, newGame, SCENES, useSkill, endTurn, doInteract, tryInteractAt, MAP, CAM, STORY, recruit, setLeader, exploreWalkTo, saveGame, serialize, restore, combatClick, selectEntry, hotbarEntries, checkTarget, addItem, openPuzzle, computeVisibility, resetFollowTrail, rebuildBlocking, T, tileAt, idx, AU, runAI, afterAction, partyUnits };
SCENE.go('title');
requestAnimationFrame(frame);

</script>
